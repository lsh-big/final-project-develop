name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.VITE_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_PUBLIC_DEMO: ${{ vars.VITE_PUBLIC_DEMO || '1' }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module -e '
            const value = process.env.VITE_API_BASE_URL;
            const url = URL.canParse(value) ? new URL(value) : null;
            if (!url || url.protocol !== "https:" || value.replace(/\/$/, "") !== url.origin) {
              console.error("Set repository variable VITE_API_BASE_URL to the HTTPS backend origin.");
              process.exit(1);
            }
          '
          npm ci
          npm run typecheck
          npm run build -- --base "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
